# 最终漏网之鱼兜底
FINAL,🐟 漏网之鱼

[Host]
# 1. DoH 域名 Bootstrap 静态映射（解决 DoH 启动解析依赖的“鸡生蛋”死锁，彻底杜绝回退本地系统 DNS 泄露）
cloudflare-dns.com = 1.1.1.1
dns.google = 8.8.8.8
doh.pub = 1.12.12.12

# 2. 解决国行/大陆设备 Google 服务与 Play 商店下载无法连接或报错问题
services.googleapis.cn = services.googleapis.com

# 3. 哔哩哔哩及国内流媒体 PCDN 彻底阻断（解决视频缓冲、高延迟及后台偷偷占用移动端上传带宽问题）
*.mcdn.bilivideo.com = 0.0.0.0
*.mcdn.bilivideo.cn = 0.0.0.0
*.edge.mountaintoys.cn = 0.0.0.0
*.h2.smtcdns.net = 0.0.0.0

# 4. 本地回环与 mDNS / Bonjour 局域网服务反查
localhost.weixin.qq.com = 127.0.0.1
localhost = 127.0.0.1
*.local = server:system
*.in-addr.arpa = server:system
*.ip6.arpa = server:system
*._dns-sd._udp.*.in-addr.arpa = server:system

# 5. Apple 系统服务系统直连解析（加速 App Store CDN）
*.apple-cloudkit.com = server:system
*.cdn-apple.com = server:system
*.icloud-content.com = server:system

[URL Rewrite]
# Google 搜索中国大陆域名重定向为全球域名
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
hostname = *.google.cn
